<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffbf4">
<title>Page Not Found (404) — DabbaGo</title>
<meta name="description" content="This DabbaGo page could not be found. Head back to the home page, browse the weekly tiffin menu or check whether we deliver to your area.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e2661c'/%3E%3Cpath d='M8.5 12.5h15v6.5a7.5 7.5 0 0 1-15 0z' fill='none' stroke='white' stroke-width='2.1' stroke-linejoin='round'/%3E%3Cpath d='M7.5 12.5h17' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3Cpath d='M12 9.5h8' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* Apply the saved theme and text direction before first paint so there is no flash */
(function () {
  try {
    var k = "dabbago_theme";
    var s = localStorage.getItem(k);
    var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var t = (s === "light" || s === "dark") ? s : (m ? "dark" : "light");
    document.documentElement.classList.toggle("dark", t === "dark");
    document.documentElement.style.colorScheme = t;
  } catch (e) {}
  try {
    var d = localStorage.getItem("dabbago_dir");
    document.documentElement.setAttribute("dir", d === "rtl" ? "rtl" : "ltr");
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        cream: 'var(--dg-bg)', softbg: 'var(--dg-bg-soft)', surface: 'var(--dg-surface)',
        surface2: 'var(--dg-surface-2)', surface3: 'var(--dg-surface-3)', line: 'var(--dg-line)',
        linestrong: 'var(--dg-line-strong)', ink: 'var(--dg-ink)', inksoft: 'var(--dg-ink-soft)',
        inkmute: 'var(--dg-ink-mute)', brand: 'var(--dg-brand)', brandsoft: 'var(--dg-brand-soft)',
        leaf: 'var(--dg-green)', leafsoft: 'var(--dg-green-soft)', cocoa: 'var(--dg-brown)'
      },
      fontFamily: {
        display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
      }
    }
  }
};
</script>
<link rel="stylesheet" href="css/styles.css">
<script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page="notfound" class="standalone-404">
<a class="dg-skip" href="#main">Skip to main content</a>

<main id="main" class="dg-main">

  <section class="dg-shell" style="position:relative;overflow:hidden">
    <span class="dg-blob dg-blob-orange" style="width:20rem;height:20rem;top:-5rem;left:-6rem"></span>
    <span class="dg-blob dg-blob-green" style="width:16rem;height:16rem;bottom:-6rem;right:-5rem"></span>

    <div class="dg-404 relative" style="z-index:1">
      <span class="dg-icon-tile" style="width:4.2rem;height:4.2rem">
        <i data-lucide="soup" style="width:2rem;height:2rem"></i>
      </span>

      <p class="dg-404-code">404</p>

      <h1 class="text-2xl sm:text-3xl">This tiffin never made it to the kitchen</h1>
      <p class="dg-lede" style="max-width:32rem">
        The page you were looking for has moved, been renamed, or never existed. Nothing is broken on
        your side &mdash; the food is still on schedule.
      </p>

      <div class="flex flex-col sm:flex-row gap-2.5 flex-wrap justify-center mt-1">
        <a class="dg-btn dg-btn-primary dg-btn-lg" href="index.html">
          <i data-lucide="house"></i>Back to home
        </a>
        <a class="dg-btn dg-btn-outline dg-btn-lg" href="menu.html">
          <i data-lucide="utensils-crossed"></i>See today&rsquo;s menu
        </a>
      </div>
    </div>

  </section>

</main>

<div id="dg-modal-root"></div>

<script defer src="js/main.js"></script>
</body>
</html>
