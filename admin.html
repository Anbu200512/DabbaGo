<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffbf4">
<title>Admin Dashboard — DabbaGo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e2661c'/%3E%3Cpath d='M8.5 12.5h15v6.5a7.5 7.5 0 0 1-15 0z' fill='none' stroke='white' stroke-width='2.1' stroke-linejoin='round'/%3E%3Cpath d='M7.5 12.5h17' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3Cpath d='M12 9.5h8' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var saved = localStorage.getItem("dabbago_theme");
    var dark = saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard-pages.css">
<script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page="admin" class="standalone-dashboard">
<a class="dg-skip" href="#admin-main">Skip to dashboard</a>
<div class="dp-admin-layout">
  <aside class="ad-sidebar">
    <a class="dg-logo ad-logo" href="index.html" aria-label="DabbaGo home">
      <span class="dg-logo-mark"><i data-lucide="cooking-pot"></i></span><span>Dabba<em>Go</em></span>
    </a>
    <div class="ad-workspace"><span class="ad-workspace-mark"><i data-lucide="shield-check"></i></span><span><strong>Operations</strong><small>Admin workspace</small></span></div>
    <nav class="ad-nav" aria-label="Admin dashboard sections">
      <button type="button" class="ad-nav-item is-active" data-admin-tab="overview"><i data-lucide="layout-dashboard"></i>Overview</button>
      <button type="button" class="ad-nav-item" data-admin-tab="orders"><i data-lucide="receipt-text"></i>Orders <span class="ad-nav-badge" id="ad-open-count">0</span></button>
      <button type="button" class="ad-nav-item" data-admin-tab="customers"><i data-lucide="users"></i>Customers</button>
      <button type="button" class="ad-nav-item" data-admin-tab="menu"><i data-lucide="utensils"></i>Menu &amp; dishes</button>
      <button type="button" class="ad-nav-item" data-admin-tab="deliveries"><i data-lucide="truck"></i>Deliveries</button>
      <button type="button" class="ad-nav-item" data-admin-tab="reports"><i data-lucide="chart-column"></i>Reports</button>
    </nav>
    <div class="dashboard-sidebar-controls" aria-label="Display options">
      <button type="button" class="dg-iconbtn" data-dg-dir-toggle aria-pressed="false" aria-label="Switch to right-to-left" title="Switch to RTL"><i data-lucide="arrow-right-left" class="dg-icon-ltr"></i><i data-lucide="arrow-left-right" class="dg-icon-rtl"></i></button>
      <button type="button" class="dg-iconbtn" data-dg-theme-toggle aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
    </div>
    <div class="ad-sidebar-bottom">
      <a class="ad-nav-item" href="index.html"><i data-lucide="external-link"></i>View website</a>
      <button type="button" class="ad-nav-item ad-signout" data-admin-signout><i data-lucide="log-out"></i>Sign out</button>
      <span><i data-lucide="circle-check"></i>All systems operational</span>
    </div>
  </aside>
  <button type="button" class="dashboard-sidebar-scrim" data-dashboard-sidebar-close aria-label="Close dashboard menu"></button>

  <div class="ad-main-column">
    <header class="ad-topbar">
      <div class="dashboard-topbar-brand">
        <a class="dg-logo" href="index.html" aria-label="DabbaGo home"><span class="dg-logo-mark"><i data-lucide="cooking-pot"></i></span><span>Dabba<em>Go</em></span></a>
        <span><span class="ad-topbar-label">Admin workspace</span><strong id="ad-page-label">Overview</strong></span>
      </div>
      <div class="dp-topbar-actions">
        <span class="ad-live"><i></i>Live operations</span>
        <div class="dashboard-topbar-controls" aria-label="Display options">
          <button type="button" class="dg-iconbtn" data-dg-dir-toggle aria-pressed="false" aria-label="Switch to right-to-left" title="Switch to RTL"><i data-lucide="arrow-right-left" class="dg-icon-ltr"></i><i data-lucide="arrow-left-right" class="dg-icon-rtl"></i></button>
          <button type="button" class="dg-iconbtn" data-dg-theme-toggle aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
        </div>
        <span class="ad-admin-avatar" aria-label="Administrator">A</span>
        <button type="button" class="dg-iconbtn dashboard-menu-toggle" data-dashboard-sidebar-toggle aria-expanded="false" aria-label="Open dashboard menu"><i data-lucide="menu"></i></button>
      </div>
    </header>

    <main id="admin-main" class="ad-content">
      <section id="ad-panel-overview" class="ad-panel"></section>
      <section id="ad-panel-orders" class="ad-panel is-hidden"></section>
      <section id="ad-panel-customers" class="ad-panel is-hidden"></section>
      <section id="ad-panel-menu" class="ad-panel is-hidden"></section>
      <section id="ad-panel-deliveries" class="ad-panel is-hidden"></section>
      <section id="ad-panel-reports" class="ad-panel is-hidden"></section>
    </main>
  </div>
</div>
<script defer src="js/main.js"></script>
<script defer src="js/admin.js"></script>
<script defer src="js/dashboard-sidebar.js"></script>
</body>
</html>
