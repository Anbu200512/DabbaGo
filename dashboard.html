<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e2661c'/%3E%3Cpath d='M8.5 12.5h15v6.5a7.5 7.5 0 0 1-15 0z' fill='none' stroke='white' stroke-width='2.1' stroke-linejoin='round'/%3E%3Cpath d='M7.5 12.5h17' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3Cpath d='M12 9.5h8' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta http-equiv="refresh" content="0;url=user.html">
  <title>My Dashboard — DabbaGo</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 12% 12%, #f9e5ce 0, transparent 34%),
                  radial-gradient(ellipse at 88% 90%, #e7efdf 0, transparent 32%), #fffbf4;
      color: #4a2f18;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .dg-splash { display: grid; justify-items: center; gap: 0.9rem; text-align: center; padding: 2rem; }
    .dg-splash-mark {
      display: grid; place-items: center; width: 4rem; height: 4rem;
      border-radius: 1.2rem; background: #e2661c; color: #fff;
      box-shadow: 0 12px 30px rgba(226, 102, 28, 0.32);
    }
    .dg-splash-mark svg { width: 2rem; height: 2rem; }
    .dg-splash-name { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.035em; }
    .dg-splash-name em { color: #e2661c; font-style: normal; }
    .dg-splash-spin {
      width: 1.55rem; height: 1.55rem; border-radius: 50%;
      border: 3px solid rgba(226, 102, 28, 0.22); border-top-color: #e2661c;
      animation: dg-splash-spin 0.7s linear infinite;
    }
    .dg-splash p { margin: 0; font-size: 0.85rem; color: #8a6a4a; }
    .dg-splash a { color: #e2661c; font-weight: 700; }
    @keyframes dg-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .dg-splash-spin { animation-duration: 1.6s; } }
  </style>
</head>
<body>
  <div class="dg-splash" role="status" aria-live="polite">
    <span class="dg-splash-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M8.5 12.5h15v6.5a7.5 7.5 0 0 1-15 0z" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/><path d="M7.5 12.5h17" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M12 9.5h8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
    </span>
    <span class="dg-splash-name">Dabba<em>Go</em></span>
    <span class="dg-splash-spin" aria-hidden="true"></span>
    <p>Opening your dashboard&hellip; <a href="user.html">Continue</a></p>
  </div>
  <script>window.location.replace("user.html" + window.location.search + window.location.hash);</script>
</body>
</html>
